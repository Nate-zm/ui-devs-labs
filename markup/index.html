<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    

    <link rel="stylesheet" href="style/styles/normalize.css" />
    <link rel="stylesheet" href="style/styles/style.css" />
    
    <title>Nyirenda Список задач</title>
  </head>
  <body>
  <header>
    Список задач
  </header>
  <div class="container">
    <div class="new-task-card">
      <h2>Новая задача</h2>
      <div class="input-group">
        <input type="text" class="task-input" placeholder="Название задачи..." />
        <button class="add-button">
          <span>+</span>
          Добавить
        </button>
      </div>
    </div>
    <div class="columns">
      <!-- Бэклог -->
      <div class="column">
        <div class="column-header backlog">Бэклог</div>
        <div class="task-item">Выучить JS</div>
        <div class="task-item">Выучить React</div>
        <div class="task-item">Сделать домашку</div>
      </div>
      <!-- В процессе -->
      <div class="column">
        <div class="column-header in-progress">В процессе</div>
        <div class="task-item">Выпить смузи</div>
        <div class="task-item">Попить воды</div>
      </div>
      <!-- Готово -->
      <div class="column">
        <div class="column-header done">Готово</div>
        <div class="task-item">Позвонить маме</div>
        <div class="task-item">Погладить кота</div>
      </div>
      <!-- Корзина -->
      <div class="column">
        <div class="column-header trash">Корзина</div>
        <div class="task-item">Сходить погулять</div>
        <div class="task-item">Прочитать Войну и Мир</div>
        <button class="clear-button">
          <span>×</span>
          Очистить
        </button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
